name: Release

# Only once Test has gone green on main. A release is a tag that consumers and
# `git compare` links resolve forever — and now also a version on npm, which is
# immutable — so it must never name a commit whose suite was red.
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

# Nothing by default; each job takes only what it needs. The job that mints a
# publish credential cannot write to the repository, and the job that writes
# tags cannot mint one.
permissions: {}

# Two green mains in quick succession must not race each other into the
# registry. Never cancelled: a half-finished release is worse than a slow one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # `branches: [main]` above filters `workflow_run.head_branch`, which for a
    # `pull_request` run is the *source* branch — and Test runs fork PRs. A fork
    # whose branch is named `main` therefore produces a green run that matches,
    # and `workflow_run` hands it this repository's context and this job's
    # credentials. The three clauses after the first are what close that: only a
    # push, to this repository, on its own `main`.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    # `prepublishOnly` re-runs `check` and the whole suite before the tarball is
    # cut, so this needs Test's budget over again, not the five minutes a tag
    # used to take.
    timeout-minutes: 10
    # Trusted publishing trusts GitHub-hosted runners only.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The OIDC token npm trades for a short-lived publish credential. This one
      # line is what replaces NPM_TOKEN.
      id-token: write
    outputs:
      version: ${{ steps.gate.outputs.version }}
    steps:
      # Pinned by digest rather than tag: this job holds a credential that can
      # write to the registry, so a repointed tag would be a way in. The comment
      # names the tag each digest stood for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `workflow_run` hands us the repository, not the commit that was
          # tested; pin the checkout to the exact sha Test passed on.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1
          # Nothing here talks to git again, and a checkout credential left in
          # `.git/config` outlives the step that needed it.
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # One source of truth with local dev; `engines` requires >=24.
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing is an npm-CLI feature, not an Actions one: an npm
      # without the OIDC exchange falls through to asking for a token this job
      # does not have, and fails with an auth error that names nothing useful.
      # Asserted rather than `npm i -g npm@latest`, because the job holding a
      # live publish credential should pull nothing extra.
      - name: npm is new enough to exchange an OIDC token
        run: |
          set -euo pipefail
          need=11.5.1
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -1)" != "$need" ]; then
            echo "npm $have cannot do trusted publishing; need >= $need" >&2
            exit 1
          fi

      # The version in package.json is the whole trigger, and the registry is
      # the only honest answer to whether it shipped. Not the GitHub release:
      # the two can come apart — a publish that fails after the tag is written,
      # a release cut by hand — and keying off the tag would wedge the package
      # out of ever publishing that version.
      - id: gate
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
            echo "$name@$version is already on npm — nothing to publish."
            echo "publish=false" >>"$GITHUB_OUTPUT"
          else
            echo "Publishing $name@$version."
            echo "publish=true" >>"$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.publish == 'true'
        run: npm ci

      # No NODE_AUTH_TOKEN, no NPM_TOKEN, no secret of any kind: npm trades this
      # job's OIDC token for a credential scoped to this package, this
      # repository and this workflow file, good for minutes. Provenance is
      # attached automatically — public repo, public package — so `--provenance`
      # would only restate it.
      #
      # `prepack` builds dist and runs verify:exports; `prepublishOnly` re-runs
      # check and the suite. Both stay: they are the last gate a tarball passes.
      - if: steps.gate.outputs.publish == 'true'
        run: npm publish

  # Only once the version is on npm, so a tag never names a release that failed
  # to ship. Still runs on every green main and still no-ops when the release
  # already exists, so ordinary merges and re-runs cost nothing.
  release:
    needs: publish
    timeout-minutes: 5
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # No checkout: `gh` needs the repository's name, not its contents, and the
      # one job that can write tags is better off never holding the tree.
      #
      # Tag and title are `v`-prefixed, the common convention.
      #
      # While this package is 0.x, a *minor* bump means the wire changed and the
      # two consumers stop interoperating until both ship. The release notes are
      # where that is said out loud — see README.md, "Changing the contract".
      - name: Release this version, if it has none
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.publish.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "$VERSION is already released — nothing to do."
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$SHA" \
            --title "v$VERSION" \
            --generate-notes
